name: Generate contribution snake

on:
  # twice a day (00:00 and 12:00 UTC)
  schedule:
    - cron: "0 0,12 * * *"
  # run it by hand from the Actions tab
  workflow_dispatch:
  # regenerate whenever the profile README changes
  push:
    branches:
      - main

permissions:
  contents: write # needed to push the output branch

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # svg-only is the faster variant recommended by Platane/snk when no gif is needed
      - name: Generate snake.svg and snake-dark.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # publishes dist/ to the output branch, served at
      # https://raw.githubusercontent.com/<owner>/<repo>/output/<file>
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
